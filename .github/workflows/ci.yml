name: CI Build & Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - beta
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Check architecture boundaries
        run: pnpm run architecture:check

      - name: Typecheck packages
        run: pnpm run typecheck

      - name: Build packages
        run: pnpm run build

      - name: Run tests and generate coverage
        run: pnpm run test:coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: true
          files: ./coverage/clover.xml
          flags: unittests
          verbose: true

      - name: Lint code
        run: pnpm lint

  examples-typecheck:
    # Examples live in top-level examples/ and are self-contained (NOT
    # pnpm-workspace members), so they are deliberately excluded from the
    # library's gated typecheck. Type-check each one here against the library
    # source (their tsconfigs map ignite-element/* to packages/*/src) so an
    # example regression is caught even though it is not part of the workspace.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install workspace (library tsc + package sources)
        run: pnpm install

      - name: Typecheck each example (self-contained install + tsc)
        run: |
          set -u
          tsc="packages/ignite-element/node_modules/.bin/tsc"
          if [ ! -x "$tsc" ]; then
            echo "Error: tsc not found at $tsc — ensure typescript is a devDependency of packages/ignite-element"
            exit 1
          fi
          failed=""
          for dir in examples/adapters/* examples/apps/* examples/frameworks/*; do
            [ -f "$dir/package.json" ] || continue
            echo "::group::$dir"
            ( cd "$dir" && pnpm install --ignore-workspace --no-link-workspace-packages )
            if "$tsc" --project "$dir/tsconfig.json"; then
              echo "PASS $dir"
            else
              echo "FAIL $dir"
              failed="$failed $dir"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "Examples failed typecheck:$failed"
            exit 1
          fi

  release:
    needs: build
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          HUSKY: 0
