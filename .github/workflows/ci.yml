name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - beta
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check architecture boundaries
        run: pnpm run architecture:check

      - name: Typecheck packages
        run: pnpm run typecheck:packages

      - name: Build packages
        run: pnpm run build

      - name: Verify packed ESM consumers
        run: pnpm run verify:packed

      - name: Run tests and generate coverage
        run: pnpm run test:coverage

      - name: Run script tests
        run: pnpm run test:scripts

      - name: Run example runtime tests
        run: pnpm run test:examples

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: true
          files: ./packages/ignite-element/coverage/clover.xml
          flags: unittests
          verbose: true

      - name: Lint code
        run: pnpm lint

  examples-typecheck:
    # Examples live in top-level examples/ and are self-contained (NOT
    # pnpm-workspace members), so they are deliberately excluded from the
    # library's gated typecheck. Their source mappings still traverse public
    # workspace exports, so this independent runner must build declarations
    # before checking every example; the build job does not share its output.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install workspace (library tsc + package sources)
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages and public declarations
        run: pnpm run build

      - name: Typecheck each example (self-contained install + tsc)
        run: pnpm run typecheck:examples
