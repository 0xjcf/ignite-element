name: Mutation testing (renderer)

on:
  schedule:
    - cron: "0 7 * * *" # daily, 07:00 UTC (03:00 ET)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-renderer
  cancel-in-progress: false

jobs:
  stryker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Reuse the previous run's results so only changed code or tests rerun.
      - name: Restore incremental state
        uses: actions/cache@v4
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.run_id }}
          restore-keys: stryker-incremental-

      - name: Run Stryker (renderer only)
        env:
          # The detached-style-root test needs global.gc(); worker threads
          # reject --expose-gc in execArgv, so expose it through NODE_OPTIONS.
          NODE_OPTIONS: --expose-gc
        run: pnpm test:mutation

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: |
            reports/mutation/
            reports/stryker-incremental.json
          retention-days: 30

      - name: Summarize score
        if: always()
        run: |
          node -e '
            const r = require("./reports/mutation/mutation.json");
            const c = {};
            for (const f of Object.values(r.files))
              for (const m of f.mutants) c[m.status] = (c[m.status] ?? 0) + 1;
            const killed = (c.Killed ?? 0) + (c.Timeout ?? 0);
            const valid = killed + (c.Survived ?? 0) + (c.NoCoverage ?? 0);
            console.log(`## Mutation score\n\n${(100 * killed / valid).toFixed(1)}% (${killed}/${valid})\n\n` + JSON.stringify(c));
          ' >> "$GITHUB_STEP_SUMMARY"