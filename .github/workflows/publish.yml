name: Stage v3 beta packages

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ignite-v3-beta-stage
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      payload-digest: ${{ steps.payload.outputs.payload-digest }}
      commit: ${{ steps.payload.outputs.commit }}
      tree: ${{ steps.payload.outputs.tree }}
    steps:
      - name: Refuse non-beta refs
        if: github.ref != 'refs/heads/beta'
        run: |
          echo "This workflow only stages an exact commit from refs/heads/beta." >&2
          exit 1

      - name: Check out the dispatched commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Install pinned pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false

      - name: Set up Node.js 22 without dependency caching
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Authenticate validation toolchain
        run: |
          test "$(node --version | cut -d. -f1)" = "v22"
          test "$(pnpm --version)" = "10.33.0"

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages and verify declarations and exports
        run: pnpm run build

      - name: Pack once and validate the exact staging payload
        id: payload
        run: >-
          node scripts/stage-beta-release.mjs prepare
          --output-dir "${{ runner.temp }}/ignite-beta-stage-payload"

      - name: Upload the bounded staging payload
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ignite-beta-stage-payload-${{ github.sha }}
          path: ${{ runner.temp }}/ignite-beta-stage-payload
          if-no-files-found: error
          retention-days: 14

  stage:
    needs: validate
    if: github.ref == 'refs/heads/beta'
    runs-on: ubuntu-22.04
    environment: npm-stage
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.commit }}

      - name: Set up Node.js 22 without dependency caching
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Pin npm staged-publishing client
        run: npm install --global npm@11.19.1

      - name: Authenticate staging toolchain
        run: |
          test "$(node --version | cut -d. -f1)" = "v22"
          test "$(npm --version)" = "11.19.1"

      - name: Download the exact validated payload
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact-id }}
          path: ${{ runner.temp }}/ignite-beta-stage-payload
          merge-multiple: true

      - name: Verify payload binding and stage privately
        id: staging
        continue-on-error: true
        run: >-
          node scripts/stage-beta-release.mjs stage
          --payload-dir "${{ runner.temp }}/ignite-beta-stage-payload"
          --receipt-dir "${{ runner.temp }}/ignite-beta-stage-receipt"
          --expected-artifact-id "${{ needs.validate.outputs.artifact-id }}"
          --expected-artifact-digest "${{ needs.validate.outputs.artifact-digest }}"
          --expected-payload-digest "${{ needs.validate.outputs.payload-digest }}"
          --expected-commit "${{ needs.validate.outputs.commit }}"
          --expected-tree "${{ needs.validate.outputs.tree }}"

      - name: Upload bounded incremental staging receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ignite-beta-stage-receipt-${{ github.sha }}
          path: ${{ runner.temp }}/ignite-beta-stage-receipt
          if-no-files-found: error
          retention-days: 14

      - name: Preserve staging failure after receipt upload
        if: steps.staging.outcome != 'success'
        run: exit 1
