name: Stage v3 beta packages

on:
  workflow_dispatch:

permissions: {}

jobs:
  stage:
    runs-on: ubuntu-22.04
    environment: npm-stage
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Refuse non-beta refs
        if: github.ref != 'refs/heads/beta'
        run: |
          echo "This workflow only stages an exact commit from refs/heads/beta." >&2
          exit 1

      - name: Checkout the dispatched commit
        if: github.ref == 'refs/heads/beta'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Install pinned pnpm
        if: github.ref == 'refs/heads/beta'
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js 22
        if: github.ref == 'refs/heads/beta'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "pnpm"

      - name: Pin npm staged-publishing client
        if: github.ref == 'refs/heads/beta'
        run: npm install --global npm@11.19.1

      - name: Authenticate toolchain
        if: github.ref == 'refs/heads/beta'
        run: |
          test "$(node --version | cut -d. -f1)" = "v22"
          test "$(npm --version)" = "11.19.1"
          test "$(pnpm --version)" = "10.33.0"

      - name: Install frozen dependencies
        if: github.ref == 'refs/heads/beta'
        run: pnpm install --frozen-lockfile

      - name: Build packages and verify declarations and exports
        if: github.ref == 'refs/heads/beta'
        run: pnpm run build

      - name: Validate exact tarballs and stage privately
        if: github.ref == 'refs/heads/beta'
        run: >-
          node scripts/stage-beta-release.mjs
          --output-dir "${{ runner.temp }}/ignite-beta-stage-receipt"

      - name: Upload bounded staging receipt
        if: always() && github.ref == 'refs/heads/beta'
        uses: actions/upload-artifact@v4
        with:
          name: ignite-beta-stage-${{ github.sha }}
          path: ${{ runner.temp }}/ignite-beta-stage-receipt
          if-no-files-found: error
          retention-days: 14
